name: Update course data

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *" # every day at 18:00 Istanbul time (UTC+3)
  workflow_dispatch:
    inputs:
      semesters:
        description: "Semesters to refresh, space separated (e.g. 2026/2027-1). Empty = newest two."
        required: false

permissions:
  contents: write # commit data, push gh-pages
  issues: write # report problems and new semesters
  actions: write # keep the daily schedule from being auto-disabled

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remember semester list
        run: cp public/data/semesters.json "$RUNNER_TEMP/semesters-before.json"

      - name: Scrape course schedule
        if: github.event_name != 'push'
        run: node scripts/scrape.mjs ${{ github.event.inputs.semesters }}

      - name: Update semester dates from the academic calendar
        if: github.event_name != 'push'
        run: node scripts/semester-dates.mjs

      - name: Commit changed data
        id: commit
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "chore: update course data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Announce new semesters
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(jq -r --slurpfile old "$RUNNER_TEMP/semesters-before.json" \
            '. - $old[0] | join(", ")' public/data/semesters.json)
          if [ -n "$new" ]; then
            gh issue create --title "New semester online: $new" --body \
              "The planner now has course data for **$new**. It is live at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi

      # GitHub turns off scheduled workflows after 60 days without repository
      # activity; re-enabling the workflow resets that timer.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automatic course data update failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again. $body"
          else
            gh issue create --title "$title" --body "The daily update stopped with an error, so the site may show old data. $body"
          fi
